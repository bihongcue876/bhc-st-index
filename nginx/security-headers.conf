# ============================================================
# 安全响应头片段
#
# 部署位置：/etc/nginx/snippets/example.com-security.conf
# 用法：在需要的 location 里 include 这一份。
#
# 为什么要做成片段：nginx 的 add_header 不叠加 ——
# 某个 location 里只要自己写了 add_header，就不再继承上层的。
# 首页要加 Cache-Control、/assets/ 要加缓存策略，
# 各写一次就会把安全头漏掉，所以统一 include。
#
# 改 CSP 前先看 README 的「安全」一节：现在不允许内联脚本与内联样式，
# 加统计、字体、外链图片都要在这里逐个放行。
# ============================================================

# 不让浏览器猜 MIME
add_header X-Content-Type-Options nosniff always;

# 跨站只带域名，不带完整路径
add_header Referrer-Policy strict-origin-when-cross-origin always;

# 不允许被别的站点套框
add_header X-Frame-Options SAMEORIGIN always;

# 打开的外部窗口拿不到本页的 window 引用
add_header Cross-Origin-Opener-Policy same-origin always;

# 本站资源不允许被其它源当子资源加载
add_header Cross-Origin-Resource-Policy same-origin always;

# 这些能力本站用不到，直接关掉
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;

# 内容安全策略：
#   default-src 'self'   —— 默认只认本站
#   script-src  'self'   —— 没有内联脚本、没有 eval
#   style-src   'self'   —— 没有内联样式与 style 属性
#   img-src     'self' data:  —— 图片只从本站取（data: 留给内联小图标）
#   connect-src 'self'   —— fetch 只能打本站，配置与访问量都在这儿
#   frame-ancestors 'self' / base-uri 'none' / object-src 'none' —— 收口
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests" always;
