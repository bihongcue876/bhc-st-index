# ============================================================
# nginx 站点配置（参考）
#
# 放置位置二选一：
#   /etc/nginx/conf.d/example.com.conf
#   /etc/nginx/sites-available/example.com.conf（再软链到 sites-enabled）
#
# 改动清单：
#   1. server_name      两个 server 块里都要改
#   2. root             指向站点目录
#   3. ssl_certificate* 换域名（路径对不上 nginx 会启动失败）
#
# 检查与生效：
#   nginx -t && systemctl reload nginx
#
# 如果服务器上已有主页的 server 块，用这份替换掉它，
# 但先把原文件备份：cp xxx.conf xxx.conf.bak
# ============================================================


# ------------------------------------------------------------
# HTTP：全部跳转到 HTTPS
# ------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name example.com www.example.com;

    # 还没申请证书时（certbot 验证需要 80 端口可达），
    # 先注释掉下面这行，等证书签下来再打开。
    return 301 https://example.com$request_uri;

    # 临时占位用（证书申请下来后删掉这一段）：
    # root  /var/www/example.com;
    # index index.html;
    # location / { try_files $uri $uri/ =404; }
}


# ------------------------------------------------------------
# HTTPS：主页
# ------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;

    # nginx >= 1.25.1 用这行；更老的版本删掉它，
    # 改成 listen 443 ssl http2;
    http2       on;

    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /var/www/example.com;
    index index.html;

    charset     utf-8;
    autoindex   off;

    # ---- 压缩 ----
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/xml
                    application/javascript application/json
                    application/xml image/svg+xml;

    # ---- 安全响应头 ----
    # 统一放在片段里。nginx 的 add_header 不叠加：某个 location 里
    # 只要自己写了 add_header，就不再继承 server 级的，
    # 所以凡是会写缓存头的地方都 include 同一份。
    # 片段：nginx/security-headers.conf -> /etc/nginx/snippets/example.com-security.conf
    include /etc/nginx/snippets/example.com-security.conf;

    # ---- 静态资源 ----
    # 只有文件名带版本号（如 style.a1b2c3.css）时，长缓存才安全。
    # 如果文件名固定不变，把 max-age 改成 0 或删掉本段。
    location ^~ /assets/ {
        include /etc/nginx/snippets/example.com-security.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # 数据文件：改完要立刻生效，所以不进浏览器缓存
    location = /assets/data/site.json {
        include /etc/nginx/snippets/example.com-security.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =404;
    }

    location = /assets/data/visits.json {
        include /etc/nginx/snippets/example.com-security.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =404;
    }

    # data 目录里除上面两个文件外，一律不对外
    location ^~ /assets/data/ {
        include /etc/nginx/snippets/example.com-security.conf;
        return 404;
    }

    # HTML 不缓存，改完即时生效
    location = /index.html {
        include /etc/nginx/snippets/example.com-security.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        # 允许省略 .html 访问：/about 也能打开 /about.html
        try_files $uri $uri.html $uri/ =404;
    }

    # ---- 404 ----
    error_page 404 /404.html;
    location = /404.html { internal; }

    # ---- 屏蔽隐藏文件与备份文件 ----
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(bak|swp|old|orig)$ { deny all; }

    # ---- 只在服务器上用的东西，不对外提供 ----
    # 工具脚本、参考配置、项目文档都不该被公网下载；
    # 用 404 而不是 403，免得暴露"这里确实有东西"。
    location ~* ^/(tools|nginx|preview\.(cmd|sh)|README\.md|WORKLOG\.md)(/|$) {
        return 404;
    }

    # ---- 日志 ----
    access_log /var/log/nginx/example.com.access.log;
    error_log  /var/log/nginx/example.com.error.log warn;

    # --------------------------------------------------------
    # 以后要把某个服务挂到站内，用反代。示例：
    #
    # location /app/ {
    #     proxy_pass         http://127.0.0.1:8080/;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 300s;
    # }
    #
    # 更推荐给独立子域名（a.example.com）单独一个 server 块，
    # 证书和 cookie 隔离干净，不会踩子路径资源错乱。
    #
    # 想给某些页面加密码：
    # auth_basic           "Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    # （生成：htpasswd -c /etc/nginx/.htpasswd 用户名）
    # --------------------------------------------------------
}
