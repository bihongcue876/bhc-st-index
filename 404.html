<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- 配色在样式表之前定下来（同步脚本，上 CSP 后也不需要放开内联脚本） -->
<script src="/assets/js/theme-boot.js"></script>

<title>BHC-Tech | 页面不存在</title>
<meta name="robots" content="noindex">

<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/theme.css">
<link rel="stylesheet" href="/assets/css/pages.css">
</head>

<body>
<!-- ---------------- 报头：站名 + 检索 / 主题 / 设置 ---------------- -->
<header class="masthead">
  <div class="container masthead-inner">
    <div class="masthead-id">
      <p class="masthead-name"><a href="/">bhc-st.site</a></p>
      <p class="masthead-tag">技术演示站</p>
    </div>

    <div class="masthead-tools">
      <button class="tool-btn" id="search-open" type="button"
              aria-label="检索本站" aria-expanded="false" aria-controls="search-overlay">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="7" cy="7" r="4.4"></circle>
          <path d="M10.4 10.4 14 14" stroke-linecap="round"></path>
        </svg>
        <span class="visually-hidden">检索</span>
      </button>

      <button class="tool-btn" id="theme-cycle" type="button"
              aria-label="切换配色" data-theme-pref-name="跟随系统">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.4"></circle>
          <path d="M8 2.4a5.6 5.6 0 0 1 0 11.2Z" fill="currentColor"></path>
        </svg>
        <span class="visually-hidden">切换配色</span>
      </button>

      <button class="tool-btn" id="settings-open" type="button"
              aria-label="设置" aria-expanded="false" aria-controls="settings-overlay">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <path d="M2 4.5h12M2 11.5h12" stroke-linecap="round"></path>
          <circle cx="5.5" cy="4.5" r="1.6" fill="none"></circle>
          <circle cx="10.5" cy="11.5" r="1.6" fill="none"></circle>
        </svg>
        <span class="visually-hidden">设置</span>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <div class="container">

    <div class="page-head">
      <p class="page-kicker">404</p>
      <h1 class="page-title">页面不存在</h1>
      <p class="page-desc">这个地址没有对应的页面，可能是拼错了，也可能内容已经挪走。</p>
    </div>

    <section class="page-section">
      <div class="prose">
        <p>可以从这三处重新进去：<a href="/">首页</a>、<a href="/articles.html">文章</a>、<a href="/resources.html">服务</a>。</p>
        <p>如果确定地址没错，可以在<a href="/about.html#contact">关于</a>页找到联系方式。</p>
      </div>
    </section>

  </div>
</main>

<!-- ---------------- 页脚 ---------------- -->
<footer class="site-footer">
  <div class="container footer-inner">
    <nav class="footer-nav" aria-label="页脚导航">
      <a href="/guide.html">说明</a>
      <a href="/about.html">关于</a>
      <a href="https://github.com/" target="_blank" rel="noopener noreferrer" data-github hidden>GitHub</a>
    </nav>

    <p class="footer-line">BHC技术演示站</p>
    <p class="footer-line">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">闽ICP备2026044016号-1</a>
    </p>
  </div>
</footer>

<div class="search-overlay" id="search-overlay" hidden>
  <div class="search-panel" role="dialog" aria-modal="true" aria-labelledby="search-dialog-title">
    <h2 class="visually-hidden" id="search-dialog-title">站内检索</h2>

    <form class="search" id="search" role="search" action="/" method="get" autocomplete="off">
      <div class="search-row">
        <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5"></circle>
          <path d="M10.5 10.5 14 14" stroke-linecap="round"></path>
        </svg>
        <input class="search-input" id="search-input" type="search" name="q"
               placeholder="搜索文章、服务、页面…"
               aria-label="站内检索" aria-controls="search-results" aria-expanded="false"
               autocomplete="off" spellcheck="false">
        <kbd class="search-kbd" aria-hidden="true">Esc</kbd>
      </div>
      <div class="search-results" id="search-results" role="listbox" aria-label="搜索结果" hidden></div>
      <div class="search-foot" aria-hidden="true">
        <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
        <span><kbd>Enter</kbd> 打开</span>
        <span><kbd>Esc</kbd> 关闭</span>
      </div>
    </form>
  </div>
</div>

<!-- ============================================================
     设置面板：外观、小组件、恢复默认（内容只存在本机）
     小组件的开关只在首页生效，其他页面没有组件宿主
     ============================================================ -->
<div class="sheet-overlay" id="settings-overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="sheet-head">
      <h2 class="sheet-title" id="settings-title">设置</h2>
      <button class="sheet-close" type="button" data-settings-close aria-label="关闭设置">×</button>
    </div>

    <div class="sheet-body">

      <section class="sheet-group" aria-labelledby="settings-theme">
        <h3 class="sheet-group-title" id="settings-theme">外观</h3>
        <div class="seg" role="group" aria-label="配色">
          <button class="seg-btn" type="button" data-theme-set="light" aria-pressed="false">浅色</button>
          <button class="seg-btn" type="button" data-theme-set="dark" aria-pressed="false">深色</button>
          <button class="seg-btn" type="button" data-theme-set="auto" aria-pressed="true">跟随系统</button>
        </div>
        <p class="sheet-note">选择只存在本机浏览器里。</p>
      </section>

      <section class="sheet-group" aria-labelledby="settings-widgets">
        <h3 class="sheet-group-title" id="settings-widgets">小组件</h3>
        <ul class="check-list" data-widget-options></ul>
        <p class="sheet-note">小组件只在首页显示，内容写在本机 cookie，不会上传。</p>
      </section>

      <section class="sheet-group" aria-labelledby="settings-data">
        <h3 class="sheet-group-title" id="settings-data">内容</h3>
        <p class="sheet-note" data-config-info>文章与服务由服务器上的配置文件提供。</p>
        <button class="sheet-reset" type="button" data-settings-reset>恢复默认</button>
      </section>

    </div>
  </div>
</div>

<script src="/assets/js/site.js" defer></script>
<script src="/assets/js/theme.js" defer></script>
<script src="/assets/js/search.js" defer></script>
<script src="/assets/js/settings.js" defer></script>
</body>
</html>
